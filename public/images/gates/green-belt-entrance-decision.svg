<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="Arial,sans-serif">
<title>Replacement gate compared with a new or widened driveway access</title>
<desc>Diagram comparing a replacement gate in an existing opening with a new or widened access that needs separate planning and highways approval. Illustrative, not a survey or approved design.</desc>
<defs>
<pattern id="hedge" width="18" height="18" patternUnits="userSpaceOnUse"><rect width="18" height="18" fill="#59645a"/><circle cx="5" cy="6" r="4" fill="#6f7b68"/><circle cx="13" cy="12" r="4" fill="#4c574d"/></pattern>
<pattern id="newsurface" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#f0e3c9"/><line x1="0" y1="0" x2="0" y2="12" stroke="#d8c39b" stroke-width="5"/></pattern>
</defs>
<rect width="1200" height="675" fill="#e8efe2"/>
<line x1="20" y1="92" x2="1180" y2="92" stroke="#3044e8" stroke-width="2.5" stroke-dasharray="12 8"/>
<text x="600" y="78" text-anchor="middle" font-size="17" fill="#3044e8">Green Belt boundary (check policies map)</text>
<g id="left">
<rect x="30" y="110" width="555" height="455" rx="14" fill="#f4f2eb" stroke="#c9cfc3" stroke-width="2"/>
<text x="307" y="150" text-anchor="middle" font-size="26" font-weight="bold" fill="#262d27">Replacement</text>
<rect x="50" y="300" width="200" height="34" fill="url(#hedge)"/>
<rect x="365" y="300" width="200" height="34" fill="url(#hedge)"/>
<rect x="245" y="298" width="18" height="38" fill="#303c49"/>
<rect x="352" y="298" width="18" height="38" fill="#303c49"/>
<line x1="263" y1="317" x2="307" y2="317" stroke="#303c49" stroke-width="7"/>
<line x1="308" y1="317" x2="352" y2="317" stroke="#303c49" stroke-width="7"/>
<path d="M263 317 A44 44 0 0 1 294 286" fill="none" stroke="#303c49" stroke-width="1.5" stroke-dasharray="4 4"/>
<path d="M352 317 A44 44 0 0 0 321 286" fill="none" stroke="#303c49" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="263" y="180" width="89" height="118" fill="#d9d2c0"/>
<text x="307" y="232" text-anchor="middle" font-size="15" fill="#262d27">Existing</text>
<text x="307" y="251" text-anchor="middle" font-size="15" fill="#262d27">driveway</text>
<rect x="50" y="350" width="515" height="22" fill="#c9c4b6"/>
<line x1="50" y1="372" x2="565" y2="372" stroke="#8a8578" stroke-width="4"/>
<text x="560" y="366" text-anchor="end" font-size="13" fill="#262d27">Footway and kerb unchanged</text>
<rect x="50" y="376" width="515" height="120" fill="#7d8389"/>
<line x1="60" y1="436" x2="555" y2="436" stroke="#f4f2eb" stroke-width="3" stroke-dasharray="26 18"/>
<text x="307" y="478" text-anchor="middle" font-size="16" fill="#f4f2eb">Country lane</text>
<text x="307" y="530" text-anchor="middle" font-size="16" fill="#262d27">New gate leaves on the existing line and opening</text>
</g>
<g id="right">
<rect x="615" y="110" width="555" height="455" rx="14" fill="#f4f2eb" stroke="#c9cfc3" stroke-width="2"/>
<text x="892" y="150" text-anchor="middle" font-size="26" font-weight="bold" fill="#262d27">New or widened access</text>
<rect x="635" y="300" width="150" height="34" fill="url(#hedge)"/>
<rect x="1000" y="300" width="150" height="34" fill="url(#hedge)"/>
<rect x="785" y="168" width="215" height="204" fill="url(#newsurface)"/>
<rect x="785" y="168" width="215" height="204" fill="none" stroke="#303c49" stroke-width="2" stroke-dasharray="10 6"/>
<text x="795" y="188" font-size="13" fill="#262d27">New hard surfacing</text>
<rect x="785" y="300" width="45" height="34" fill="#6f7b68" fill-opacity="0.35" stroke="#59645a" stroke-width="2.5" stroke-dasharray="5 5"/>
<rect x="955" y="300" width="45" height="34" fill="#6f7b68" fill-opacity="0.35" stroke="#59645a" stroke-width="2.5" stroke-dasharray="5 5"/>
<text x="1075" y="292" text-anchor="middle" font-size="13" fill="#262d27">Hedge removed</text>
<rect x="862" y="196" width="60" height="84" rx="12" fill="#f4f2eb" stroke="#303c49" stroke-width="3"/>
<line x1="868" y1="216" x2="916" y2="216" stroke="#303c49" stroke-width="2"/>
<line x1="868" y1="260" x2="916" y2="260" stroke="#303c49" stroke-width="2"/>
<rect x="785" y="276" width="16" height="30" fill="#303c49"/>
<rect x="984" y="276" width="16" height="30" fill="#303c49"/>
<line x1="801" y1="291" x2="892" y2="291" stroke="#303c49" stroke-width="7"/>
<line x1="893" y1="291" x2="984" y2="291" stroke="#303c49" stroke-width="7"/>
<text x="930" y="268" font-size="12" fill="#262d27">Gate line</text><text x="930" y="283" font-size="12" fill="#262d27">set back</text>
<rect x="635" y="350" width="515" height="22" fill="#c9c4b6"/>
<line x1="635" y1="372" x2="785" y2="372" stroke="#8a8578" stroke-width="4"/>
<line x1="1000" y1="372" x2="1150" y2="372" stroke="#8a8578" stroke-width="4"/>
<line x1="785" y1="372" x2="1000" y2="372" stroke="#3044e8" stroke-width="4"/>
<text x="892" y="366" text-anchor="middle" font-size="13" fill="#3044e8">Dropped kerb</text>
<rect x="635" y="376" width="515" height="120" fill="#7d8389"/>
<line x1="645" y1="436" x2="1140" y2="436" stroke="#f4f2eb" stroke-width="3" stroke-dasharray="26 18"/>
<text x="892" y="478" text-anchor="middle" font-size="16" fill="#f4f2eb">Country lane</text>
<rect x="640" y="510" width="250" height="38" rx="19" fill="#262d27"/>
<text x="765" y="535" text-anchor="middle" font-size="15" fill="#f4f2eb">Planning: district or borough council</text>
<rect x="902" y="510" width="250" height="38" rx="19" fill="#3044e8"/>
<text x="1027" y="535" text-anchor="middle" font-size="15" fill="#f4f2eb">Highways: Kent County Council</text>
</g>
<text x="600" y="640" text-anchor="middle" font-size="14" fill="#59645a">Illustrative plan view, not a measured survey or approved design</text>
</svg>
